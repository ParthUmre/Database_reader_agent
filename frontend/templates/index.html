<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataChat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Cabinet+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="noise"></div>

  <div class="layout">

    <!-- ── Top bar ── -->
    <header class="topbar">
      <div class="topbar-brand">
        <div class="brand-mark">
          <div class="mark-ring"></div>
          <div class="mark-dot"></div>
        </div>
        <span class="brand-name">DataChat</span>
      </div>
      <button class="clear-btn" onclick="clearChat()" title="Clear conversation">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
        Clear
      </button>
    </header>

    <!-- ── Messages ── -->
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-rings">
          <div class="ring r1"></div>
          <div class="ring r2"></div>
          <div class="ring r3"></div>
          <div class="empty-core">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
            </svg>
          </div>
        </div>
        <p class="empty-title">Ask anything about your data</p>
        <p class="empty-sub">Your question → SQL → plain English answer</p>

        <div class="starter-pills">
          <button class="pill" onclick="ask('What are the top 10 records by revenue?')">Top 10 by revenue</button>
          <button class="pill" onclick="ask('Show a summary of data from last month')">Last month summary</button>
          <button class="pill" onclick="ask('Which entries have missing or null values?')">Find missing values</button>
          <button class="pill" onclick="ask('How many unique categories exist?')">Count unique categories</button>
        </div>
      </div>
    </div>

    <!-- ── Input ── -->
    <div class="input-dock">
      <div class="input-box" id="inputBox">
        <textarea
          id="userInput"
          placeholder="Ask a question about your database…"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="grow(this)"
        ></textarea>
        <button class="submit-btn" id="submitBtn" onclick="sendMessage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">Return to send &nbsp;·&nbsp; Shift+Return for new line</p>
    </div>

  </div>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
